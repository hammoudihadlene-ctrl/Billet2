<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>EuroScan</title>
<style>
  :root { --eu-blue:#003399; --eu-blue-dark:#001f5c; --eu-gold:#FFD700; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #fff; overflow: hidden; }

  #camera { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }

  .overlay { position: fixed; inset: 0; z-index: 2; pointer-events: none; display: flex; align-items: center; justify-content: center; }
  .frame { position: relative; width: 85%; max-width: 420px; aspect-ratio: 2.2 / 1; border-radius: 16px; box-shadow: 0 0 0 100vmax rgba(0,0,0,0.55); border: 2px dashed rgba(255,255,255,0.9); overflow: hidden; }
  .scan-line { position: absolute; left: 0; right: 0; height: 3px; background: var(--eu-gold); box-shadow: 0 0 12px var(--eu-gold); animation: scanMove 2.2s ease-in-out infinite; }
  @keyframes scanMove { 0% { top: 0; } 50% { top: calc(100% - 3px); } 100% { top: 0; } }
  .corner { position: absolute; width: 30px; height: 30px; border: 5px solid var(--eu-gold); }
  .corner.tl { top:-2px; left:-2px; border-right:none; border-bottom:none; border-top-left-radius:16px; }
  .corner.tr { top:-2px; right:-2px; border-left:none; border-bottom:none; border-top-right-radius:16px; }
  .corner.bl { bottom:-2px; left:-2px; border-right:none; border-top:none; border-bottom-left-radius:16px; }
  .corner.br { bottom:-2px; right:-2px; border-left:none; border-top:none; border-bottom-right-radius:16px; }

  .header { position: fixed; top: 0; left: 0; right: 0; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: linear-gradient(180deg, rgba(0,0,0,0.7), rgba(0,0,0,0)); z-index: 10; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .logo-circle { width: 30px; height: 30px; border-radius: 50%; background: var(--eu-blue); border: 2px solid var(--eu-gold); display: flex; align-items: center; justify-content: center; }
  .header-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 13px; }

  .controls { position: fixed; bottom: 24px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 28px; z-index: 10; }
  .btn-scan { width: 74px; height: 74px; border-radius: 50%; background: var(--eu-gold); border: 4px solid #fff; font-size: 28px; cursor: pointer; transition: transform 0.1s; }
  .btn-scan:active { transform: scale(0.92); }
  .btn-scan:disabled { opacity: 0.5; }
  .btn-side { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #fff; font-size: 18px; }

  .preview { position: fixed; inset: 0; z-index: 50; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  .preview.show { display: flex; }
  .preview img { max-width: 90%; max-height: 40%; border-radius: 12px; border: 3px solid var(--eu-gold); }
  .result-box { margin-top: 20px; background: rgba(0,31,92,0.95); border: 2px solid var(--eu-gold); border-radius: 18px; padding: 16px 24px; text-align: center; min-width: 240px; }
  .result-box .valeur { font-size: 34px; font-weight: 800; color: var(--eu-gold); }
  .result-box .devise { font-size: 14px; opacity: 0.85; margin-bottom: 4px; }
  .result-box .flag { font-size: 36px; }
  .result-box .conf { font-size: 11px; opacity: 0.6; margin-top: 8px; }
  .preview button { margin-top: 18px; background: var(--eu-gold); color: #001f5c; border: none; padding: 12px 28px; border-radius: 30px; font-size: 15px; font-weight: 700; }

  .loading { display: none; flex-direction: column; align-items: center; margin-top: 20px; }
  .loading.show { display: flex; }
  .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,215,0,0.3); border-top-color: var(--eu-gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading p { margin-top: 12px; font-size: 14px; color: var(--eu-gold); }

  .screen { position: fixed; inset: 0; background: var(--eu-blue-dark); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; z-index: 100; }
  .screen.hidden { display: none; }
  .screen h1 { color: var(--eu-gold); font-size: 22px; margin-bottom: 10px; }
  .screen p { opacity: 0.8; margin-bottom: 24px; line-height: 1.5; font-size: 14px; }
  .screen button { background: var(--eu-gold); color: #001f5c; border: none; padding: 14px 30px; border-radius: 30px; font-size: 15px; font-weight: 700; }
  .err { color: #ff8080; font-size: 13px; margin-top: 16px; }
</style>
</head>
<body>

  <div class="screen" id="permission">
    <div style="font-size:56px; margin-bottom:16px;">💶</div>
    <h1>EuroScan</h1>
    <p>Autorisez la caméra pour identifier les billets<br>EUR, CHF, USD et GBP.</p>
    <button id="btn-start">Activer la caméra</button>
    <div class="err" id="err"></div>
  </div>

  <div class="header">
    <div class="logo"><div class="logo-circle">€</div><span>EuroScan</span></div>
    <button class="header-btn" id="btn-flash">⚡ Flash</button>
  </div>

  <video id="camera" autoplay playsinline muted></video>

  <div class="overlay">
    <div class="frame">
      <div class="scan-line"></div>
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
    </div>
  </div>

  <div class="preview" id="preview">
    <img id="capturedImg" alt="Photo du billet" />
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Analyse par l'IA en cours...</p>
    </div>
    <div class="result-box" id="resultBox" style="display:none;">
      <div class="flag" id="flag">🇪🇺</div>
      <div class="devise" id="devise">—</div>
      <div class="valeur" id="valeur">—</div>
      <div class="conf" id="conf">—</div>
    </div>
    <button id="btn-close-preview">Nouveau scan</button>
  </div>

  <div class="controls">
    <button class="btn-side" id="btn-switch">🔄</button>
    <button class="btn-scan" id="btn-scan">📷</button>
    <button class="btn-side" id="btn-flash2">⚡</button>
  </div>

  <!-- 1. Chargement de Puter.js -->
  <script src="https://js.puter.com/v2/" defer></script>

  <!-- 2. Script principal après le chargement du DOM -->
  <script>
  window.addEventListener('DOMContentLoaded', function () {
    var video = document.getElementById('camera');
    var btnScan = document.getElementById('btn-scan');
    var stream = null;
    var facing = 'environment';
    var flashOn = false;

    function $(id) { return document.getElementById(id); }

    function startCamera() {
      if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      })
      .then(function (s) {
        stream = s;
        video.srcObject = s;
        return video.play();
      })
      .then(function () {
        $('permission').classList.add('hidden');
        $('err').textContent = '';
      })
      .catch(function (e) {
        if (e.name === 'NotAllowedError') {
          $('err').textContent = '❌ Permission refusée. Réglages → Safari → Caméra.';
        } else {
          $('err').textContent = '❌ ' + e.name + ' : ' + e.message;
        }
      });
    }

    $('btn-start').addEventListener('click', startCamera);

    $('btn-switch').addEventListener('click', function () {
      facing = (facing === 'environment') ? 'user' : 'environment';
      startCamera();
    });

    function toggleFlash() {
      if (!stream) return;
      var track = stream.getVideoTracks()[0];
      var caps = track.getCapabilities ? track.getCapabilities() : {};
      if (!caps.torch) { alert('Flash non disponible.'); return; }
      flashOn = !flashOn;
      track.applyConstraints({ advanced: [{ torch: flashOn }] }).catch(function () {});
    }
    $('btn-flash').addEventListener('click', toggleFlash);
    $('btn-flash2').addEventListener('click', toggleFlash);

    $('btn-scan').addEventListener('click', function () {
      if (!stream) { alert('Activez d\'abord la caméra.'); return; }
      if (navigator.vibrate) navigator.vibrate(60);

      var flash = document.createElement('div');
      flash.style.cssText = 'position:fixed;inset:0;background:white;z-index:40;opacity:0.8;transition:opacity 0.3s;';
      document.body.appendChild(flash);
      setTimeout(function () { flash.style.opacity = '0'; }, 50);
      setTimeout(function () { flash.remove(); }, 400);

      var canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 1080;
      canvas.height = video.videoHeight || 1920;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      var dataURL = canvas.toDataURL('image/jpeg', 0.85);
      $('capturedImg').src = dataURL;

      $('preview').classList.add('show');
      $('loading').classList.add('show');
      $('resultBox').style.display = 'none';
      btnScan.disabled = true;

      if (typeof puter === 'undefined' || !puter.ai) {
        $('loading').classList.remove('show');
        $('resultBox').style.display = 'block';
        $('valeur').textContent = 'Indisponible';
        $('devise').textContent = "L'IA n'a pas pu se charger";
        $('flag').textContent = '⚠️';
        $('conf').textContent = 'Rechargez la page';
        btnScan.disabled = false;
        return;
      }

      var prompt = 'Quel est la valeur et la devise de ce billet de banque ? Réponds UNIQUEMENT par la valeur numérique suivie du symbole (ex: 50€, 20CHF, 100$, 10£). Rien d\'autre.';

      puter.ai.chat(prompt, dataURL, { model: 'google/gemini-2.0-flash' })
        .then(function (reponse) {
          var resultat = '';
          if (typeof reponse === 'string') resultat = reponse;
          else if (reponse && reponse.text) resultat = reponse.text;
          else if (reponse && reponse.message && reponse.message.content) resultat = reponse.message.content;
          else resultat = JSON.stringify(reponse);

          resultat = resultat.trim();
          var match = resultat.match(/(\d+)\s*(€|CHF|\$|£)/);

          if (match) {
            var valeur = match[1];
            var symbole = match[2];
            var configs = {
              '€':   { nom: 'Euro',           flag: '🇪🇺' },
              'CHF': { nom: 'Franc suisse',   flag: '🇨🇭' },
              '$':   { nom: 'Dollar US',      flag: '🇺🇸' },
              '£':   { nom: 'Livre sterling', flag: '🇬🇧' }
            };
            var c = configs[symbole] || { nom: 'Inconnu', flag: '🏳️' };
            $('valeur').textContent = valeur + ' ' + symbole;
            $('devise').textContent = c.nom;
            $('flag').textContent = c.flag;
            $('conf').textContent = 'Analysé par IA';
          } else {
            $('valeur').textContent = resultat.substring(0, 40);
            $('devise').textContent = 'Réponse non reconnue';
            $('flag').textContent = '🔍';
            $('conf').textContent = resultat.substring(0, 60);
          }
        })
        .catch(function (error) {
          console.error('Erreur IA:', error);
          $('valeur').textContent = 'Erreur';
          $('devise').textContent = 'Analyse impossible';
          $('flag').textContent = '⚠️';
          $('conf').textContent = (error && error.message) ? error.message.substring(0, 60) : 'Réessayez';
        })
        .then(function () {
          $('loading').classList.remove('show');
          $('resultBox').style.display = 'block';
          btnScan.disabled = false;
        });
    });

    $('btn-close-preview').addEventListener('click', function () {
      $('preview').classList.remove('show');
    });
  });
  </script>

</body>
</html>
