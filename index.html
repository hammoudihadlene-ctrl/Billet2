<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EuroScan détecteur de billes </title>
<style>
:root {
  --bleu: #003399;
  --bleu-fonce: #001f5c;
  --or: #FFD700;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #000;
  color: #fff;
  overflow: hidden;
}
#camera {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  z-index: 1;
}
.cadre-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 2;
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
}
.cadre {
  position: relative;
  width: 85%;
  max-width: 400px;
  height: 40vh;
  border: 2px dashed #fff;
  border-radius: 16px;
  box-shadow: 0 0 0 100vmax rgba(0,0,0,0.55);
}
.ligne-scan {
  position: absolute;
  left: 0; right: 0;
  height: 3px;
  background: var(--or);
  box-shadow: 0 0 12px var(--or);
  animation: scan 2.5s ease-in-out infinite;
}
@keyframes scan {
  0% { top: 0; }
  50% { top: calc(100% - 3px); }
  100% { top: 0; }
}
.coin {
  position: absolute;
  width: 30px; height: 30px;
  border: 5px solid var(--or);
}
.coin-hg { top: -4px; left: -4px; border-right: none; border-bottom: none; border-top-left-radius: 16px; }
.coin-hd { top: -4px; right: -4px; border-left: none; border-bottom: none; border-top-right-radius: 16px; }
.coin-bg { bottom: -4px; left: -4px; border-right: none; border-top: none; border-bottom-left-radius: 16px; }
.coin-bd { bottom: -4px; right: -4px; border-left: none; border-top: none; border-bottom-right-radius: 16px; }

.entete {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: linear-gradient(180deg, rgba(0,0,0,0.7), rgba(0,0,0,0));
  z-index: 10;
}
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.logo-rond {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--bleu);
  border: 2px solid var(--or);
  display: flex;
  align-items: center;
  justify-content: center;
}
.btn-entete {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  color: #fff;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 13px;
}
.controles {
  position: fixed;
  bottom: 24px;
  left: 0; right: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 28px;
  z-index: 10;
}
.btn-scan {
  width: 74px; height: 74px;
  border-radius: 50%;
  background: var(--or);
  border: 4px solid #fff;
  font-size: 28px;
  cursor: pointer;
}
.btn-scan:active { transform: scale(0.92); }
.btn-scan:disabled { opacity: 0.5; }
.btn-cote {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  color: #fff;
  font-size: 18px;
}

.ecran {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bleu-fonce);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px;
  text-align: center;
  z-index: 100;
}
.ecran.cache { display: none; }
.ecran h1 { color: var(--or); font-size: 24px; margin-bottom: 12px; }
.ecran p { opacity: 0.85; margin-bottom: 24px; line-height: 1.5; font-size: 15px; }
.ecran button {
  background: var(--or);
  color: var(--bleu-fonce);
  border: none;
  padding: 14px 32px;
  border-radius: 30px;
  font-size: 16px;
  font-weight: 700;
}
.erreur { color: #ff8080; font-size: 13px; margin-top: 16px; }

.apercu {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 50;
  background: #000;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow-y: auto;
}
.apercu.visible { display: flex; }
.apercu img {
  max-width: 90%;
  max-height: 35vh;
  border-radius: 12px;
  border: 3px solid var(--or);
}
.bloc-resultat {
  margin-top: 20px;
  background: rgba(0,31,92,0.95);
  border: 2px solid var(--or);
  border-radius: 18px;
  padding: 16px 24px;
  text-align: center;
  min-width: 240px;
}
.bloc-resultat .drapeau { font-size: 36px; }
.bloc-resultat .devise { font-size: 14px; opacity: 0.85; margin-bottom: 4px; }
.bloc-resultat .valeur { font-size: 36px; font-weight: 800; color: var(--or); }
.bloc-resultat .info { font-size: 11px; opacity: 0.6; margin-top: 8px; }
.apercu .btn-fermer {
  margin-top: 18px;
  background: var(--or);
  color: var(--bleu-fonce);
  border: none;
  padding: 12px 28px;
  border-radius: 30px;
  font-size: 15px;
  font-weight: 700;
}
.chargement { display: none; flex-direction: column; align-items: center; margin-top: 20px; }
.chargement.visible { display: flex; }
.spinner {
  width: 40px; height: 40px;
  border: 4px solid rgba(255,215,0,0.3);
  border-top-color: var(--or);
  border-radius: 50%;
  animation: rotation 0.8s linear infinite;
}
@keyframes rotation { to { transform: rotate(360deg); } }
.chargement p { margin-top: 12px; font-size: 14px; color: var(--or); }
</style>
</head>
<body>

<div class="ecran" id="ecran-demarrage">
  <div style="font-size:56px; margin-bottom:16px;">💶</div>
  <h1>EuroScan</h1>
  <p>Autorisez la caméra pour identifier les billets<br>EUR, CHF, USD et GBP.</p>
  <button id="btn-demarrer">Activer la caméra</button>
  <div class="erreur" id="message-erreur"></div>
</div>

<div class="entete">
  <div class="logo">
    <div class="logo-rond">€</div>
    <span>EuroScan</span>
  </div>
  <button class="btn-entete" id="btn-flash-haut">⚡ Flash</button>
</div>

<video id="camera" autoplay playsinline muted></video>

<div class="cadre-overlay">
  <div class="cadre">
    <div class="ligne-scan"></div>
    <div class="coin coin-hg"></div>
    <div class="coin coin-hd"></div>
    <div class="coin coin-bg"></div>
    <div class="coin coin-bd"></div>
  </div>
</div>

<div class="apercu" id="apercu">
  <img id="photo" alt="Photo du billet">
  <div class="chargement" id="chargement">
    <div class="spinner"></div>
    <p id="texte-chargement">Analyse par l'IA en cours...</p>
  </div>
  <div class="bloc-resultat" id="bloc-resultat" style="display:none;">
    <div class="drapeau" id="drapeau">🇪🇺</div>
    <div class="devise" id="devise">—</div>
    <div class="valeur" id="valeur">—</div>
    <div class="info" id="info">—</div>
  </div>
  <button class="btn-fermer" id="btn-fermer">Nouveau scan</button>
</div>

<div class="controles">
  <button class="btn-cote" id="btn-switch">🔄</button>
  <button class="btn-scan" id="btn-scan">📷</button>
  <button class="btn-cote" id="btn-flash-bas">⚡</button>
</div>

<script>
// ⚠️ COLLE TA CLÉ AGNES ICI entre les guillemets :
var AGNES_API_KEY = "sk-7scWEllvuHvLvXs6ZHaUd1F0qXTKO29Q0k7xYYS6XsYRMAx1";

(function() {
  var video = document.getElementById('camera');
  var btnScan = document.getElementById('btn-scan');
  var stream = null;
  var facing = 'environment';
  var flashAllume = false;

  function $(id) { return document.getElementById(id); }

  function demarrerCamera() {
    if (stream) {
      stream.getTracks().forEach(function(t) { t.stop(); });
    }
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    })
    .then(function(s) {
      stream = s;
      video.srcObject = s;
      return video.play();
    })
    .then(function() {
      $('ecran-demarrage').classList.add('cache');
      $('message-erreur').textContent = '';
    })
    .catch(function(e) {
      if (e.name === 'NotAllowedError') {
        $('message-erreur').textContent = '❌ Permission refusée. Réglages → Safari → Caméra.';
      } else {
        $('message-erreur').textContent = '❌ ' + e.name + ' : ' + e.message;
      }
    });
  }

  $('btn-demarrer').addEventListener('click', demarrerCamera);

  $('btn-switch').addEventListener('click', function() {
    facing = (facing === 'environment') ? 'user' : 'environment';
    demarrerCamera();
  });

  function basculerFlash() {
    if (!stream) return;
    var track = stream.getVideoTracks()[0];
    var caps = track.getCapabilities ? track.getCapabilities() : {};
    if (!caps.torch) { alert('Flash non disponible sur cet appareil.'); return; }
    flashAllume = !flashAllume;
    track.applyConstraints({ advanced: [{ torch: flashAllume }] }).catch(function() {});
  }
  $('btn-flash-haut').addEventListener('click', basculerFlash);
  $('btn-flash-bas').addEventListener('click', basculerFlash);

  btnScan.addEventListener('click', function() {
    if (!stream) { alert('Activez d\'abord la caméra.'); return; }

    // Effet flash blanc
    var flash = document.createElement('div');
    flash.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:white;z-index:40;opacity:0.8;transition:opacity 0.3s;pointer-events:none;';
    document.body.appendChild(flash);
    setTimeout(function() { flash.style.opacity = '0'; }, 50);
    setTimeout(function() { flash.remove(); }, 400);

    // Capture photo
    var canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 1080;
    canvas.height = video.videoHeight || 1920;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    var dataURL = canvas.toDataURL('image/jpeg', 0.85);
    $('photo').src = dataURL;

    // Afficher aperçu
    $('apercu').classList.add('visible');
    $('chargement').classList.add('visible');
    $('texte-chargement').textContent = 'Analyse par Agnes AI...';
    $('bloc-resultat').style.display = 'none';
    btnScan.disabled = true;

    analyserPhoto(dataURL, btnScan);
  });

  $('btn-fermer').addEventListener('click', function() {
    $('apercu').classList.remove('visible');
  });

  function analyserPhoto(dataURL, btn) {
    if (!AGNES_API_KEY || AGNES_API_KEY.indexOf('REMPLACE') !== -1) {
      $('chargement').classList.remove('visible');
      $('bloc-resultat').style.display = 'block';
      $('valeur').textContent = 'Clé manquante';
      $('devise').textContent = 'Ajoute ta clé Agnes dans le code';
      $('drapeau').textContent = '🔑';
      $('info').textContent = 'Ligne AGNES_API_KEY';
      btn.disabled = false;
      return;
    }

    var prompt = 'Quelle est la valeur et la devise de ce billet de banque ? Réponds UNIQUEMENT par la valeur numérique suivie du symbole (exemples : 5€, 10€, 20€, 50€, 100€, 200€, 500€, 10CHF, 20CHF, 50CHF, 100CHF, 1$, 5$, 10$, 20$, 50$, 100$, 5£, 10£, 20£, 50£). Rien d\'autre.';

    fetch('https://apihub.agnes-ai.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + AGNES_API_KEY
      },
      body: JSON.stringify({
        model: 'agnes-3.0-flash',
        messages: [
          {
            role: 'user',
            content: [
              { type: 'text', text: prompt },
              { type: 'image_url', image_url: { url: dataURL } }
            ]
          }
        ],
        max_tokens: 50
      })
    })
    .then(function(res) {
      if (!res.ok) {
        return res.text().then(function(t) {
          throw new Error('HTTP ' + res.status + ' : ' + t.substring(0, 100));
        });
      }
      return res.json();
    })
    .then(function(data) {
      var resultat = '';
      if (data && data.choices && data.choices[0] && data.choices[0].message) {
        resultat = data.choices[0].message.content || '';
      }
      resultat = String(resultat).trim();
      var match = resultat.match(/(\d+)\s*(€|CHF|\$|£)/);

      if (match) {
        var valeur = match[1];
        var symbole = match[2];
        var configs = {
          '€':   { nom: 'Euro',           drapeau: '🇪🇺' },
          'CHF': { nom: 'Franc suisse',   drapeau: '🇨🇭' },
          '$':   { nom: 'Dollar US',      drapeau: '🇺🇸' },
          '£':   { nom: 'Livre sterling', drapeau: '🇬🇧' }
        };
        var c = configs[symbole] || { nom: 'Inconnu', drapeau: '🏳️' };
        $('valeur').textContent = valeur + ' ' + symbole;
        $('devise').textContent = c.nom;
        $('drapeau').textContent = c.drapeau;
        $('info').textContent = 'Analysé par Agnes AI';
      } else {
        $('valeur').textContent = resultat.substring(0, 30);
        $('devise').textContent = 'Réponse non reconnue';
        $('drapeau').textContent = '🔍';
        $('info').textContent = resultat.substring(0, 80);
      }
    })
    .catch(function(error) {
      console.error('Erreur Agnes:', error);
      $('valeur').textContent = 'Erreur';
      $('devise').textContent = 'Analyse impossible';
      $('drapeau').textContent = '⚠️';
      $('info').textContent = (error && error.message) ? error.message.substring(0, 100) : 'Réessayez';
    })
    .then(function() {
      $('chargement').classList.remove('visible');
      $('bloc-resultat').style.display = 'block';
      btn.disabled = false;
    });
  }
})();
</script>

</body>
</html>
